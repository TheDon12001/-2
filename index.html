<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
</head>
<body>
    <main id="main">
        <div class="contact-us">
            <div class="content">
                <h2>Contactt Us</h2>
                <p>Feel free to reach out for any inquries or feedback. We are here to help!</p>
                <form action="">
                    <input type="text" name="text" id="name" placeholder="Your name">
                    <input type="email" name="email" id="email" placeholder="Your email">
                    <textarea name="message" id="message" rows="6" placeholder="Your Message" ></textarea>
                    <button type="submit" class="btn-submit">Send Message</button>
                </form>
                <div class="socail">
                    <a href="#"><i class="fa-brands fa-square-x-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2482.490107105409!2d-0.16764742352909714!3d51.522569971816736!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x48761ab62dedef01%3A0x174fa402b0f033d9!2sTesco%20Express!5e0!3m2!1sen!2suk!4v1792595954051!5m2!1sen!2suk" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
    </main>
</body>
</html>
